[project]
name = "censorlabel"
version = "2.0.0"
description = "Automatically add statutory warnings to movie scenes showing smoking, alcohol, riding without a helmet or driving without a seatbelt."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "ultralytics>=8.4",
    # Static ffmpeg build, used when ffmpeg is not on PATH.
    "imageio-ffmpeg>=0.5",
    "nicegui>=3.0",
]

[project.optional-dependencies]
# Run the GUI in a native desktop window instead of a browser tab.
native = ["pywebview>=5"]

[project.scripts]
censorlabel = "censorlabel.cli:main"
censorlabel-gui = "censorlabel.ui.app:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/censorlabel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
